# yaml-language-server: $schema=../schemas/enums/_enum.schema.json

meta:
  flags: true
  cpp:
    underlying: uint16_t
  lua:
    table: xi.spawnType

values:
  normal:        0x000 # 00:00-24:00
  at_night:      0x001 # 20:00-04:00
  at_evening:    0x002 # 18:00-06:00
  weather:       0x004
  fog:           0x008 # 02:00-07:00
  moonphase:     0x010
  lottery:       0x020
  window_open:   0x040 # respawn window is open when its zone loads
  scripted:      0x080 # scripted spawn
  window_closed: 0x100 # respawn window opens after the minimum respawn when its zone loads
